name: sphinx_fury
description: "Sphinx Fury - Egyptian Sliding Puzzle Game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons.png"
  adaptive_icon_background: "#1A0A00"
  adaptive_icon_foreground: "assets/icons.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/Horizontal_LoadingScreen.webp
    - assets/Vertical_LoadingScreen.webp
    - assets/anubis.webp
    - assets/bggame.webp
    - assets/icons.png
    - assets/pharaoh.webp
    - assets/ra.webp
    - assets/sphx.webp
